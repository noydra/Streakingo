name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_REPO: ${{ github.repository }}

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - name: Add release notes
        run: |
          existing=$(gh release view "$TAG" --json body --jq .body)
          if printf '%s' "$existing" | grep -q "## Downloads"; then
            echo "Release notes already added"
            exit 0
          fi
          version="${TAG#v}"
          generated=$(gh api "repos/$GH_REPO/releases/generate-notes" -f tag_name="$TAG" --jq .body)
          {
            if [ -n "$existing" ]; then
              printf '%s\n\n' "$existing"
            fi
            printf '## Downloads\n\n'
            printf -- '- **Windows:** `Streakingo-%s.exe`\n' "$version"
            printf -- '- **Android:** `Streakingo-%s.apk` (Android 8.0+)\n\n' "$version"
            printf 'Windows may show a SmartScreen warning because the installer is not code-signed. Choose **More info → Run anyway**.\n\n'
            printf '%s\n' "$generated"
          } > notes.md
          gh release edit "$TAG" --notes-file notes.md

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing"
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :composeApp:assembleRelease -PappVersion="$TAG"
      - name: Verify signature
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs composeApp/build/outputs/apk/release/composeApp-release.apk
      - name: Upload APK
        run: |
          file="Streakingo-${TAG#v}.apk"
          cp composeApp/build/outputs/apk/release/composeApp-release.apk "$file"
          gh release upload "$TAG" "$file" --clobber
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build installer
        run: ./gradlew :composeApp:packageExe -PappVersion="$TAG"
      - name: Upload installer
        run: |
          file="Streakingo-${TAG#v}.exe"
          cp composeApp/build/compose/binaries/main/exe/*.exe "$file"
          gh release upload "$TAG" "$file" --clobber
